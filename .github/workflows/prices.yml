name: prices
on:
  schedule: [{cron: "30 7 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "prices-bot" && git config user.email "bot@users.noreply.github.com"
          git add site/data/prices.json && (git diff --cached --quiet || git commit -m "Update prices" && git push)
